  <rect x="6" y="32" width="24" height="24" rx="5" fill="#2F5BE8" class="o" stroke-width="3"/>
  <rect x="34" y="32" width="24" height="24" rx="5" fill="#FFFFFF" class="o" stroke-width="3"/>
  <circle cx="18" cy="18" r="12" fill="#F3B23A" class="o" stroke-width="3"/>
  <rect x="34" y="6" width="22" height="22" rx="5" fill="#1D8657" class="o" stroke-width="3" transform="rotate(12 45 17)"/>
</svg>
